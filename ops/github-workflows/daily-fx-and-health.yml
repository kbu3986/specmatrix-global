name: Daily FX Snapshot & Weekly Link Health

on:
  schedule:
    # Daily FX snapshot refresh at 03:00 UTC (12:00 KST)
    - cron: "0 3 * * *"
    # Weekly Tier 3 outbound & citation link health audit every Monday at 04:30 UTC (13:30 KST)
    - cron: "30 4 * * 1"
  workflow_dispatch:
    inputs:
      run_fx_update:
        description: "Run daily FX rates snapshot update"
        type: boolean
        default: true
      run_link_health:
        description: "Run Tier 3 outbound & citation link health check"
        type: boolean
        default: true
      link_health_dry_run:
        description: "Run link health check in --dry-run mode (no live HTTP requests)"
        type: boolean
        default: false
      link_health_strict:
        description: "Fail on any single dead link (--strict); default fails on >5% dead rate"
        type: boolean
        default: false

concurrency:
  group: daily-fx-and-health
  cancel-in-progress: false

permissions: {}

jobs:
  daily-fx-update:
    name: Daily FX Snapshot Update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_fx_update)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install root pipeline dependencies
        run: npm ci

      - name: Fetch and validate daily FX rates (±15% anomaly guardrail)
        run: npm run fx:update

      - name: Verify data validation gate after FX refresh
        run: npm run validate

      - name: Commit updated FX snapshot if changed
        run: |
          # Discard transient audit report diff generated by `npm run validate`
          git checkout -- data/audit/validation-report.json 2>/dev/null || true
          if git diff --quiet -- data/snapshots/fx-rates.json; then
            echo "No FX snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/fx-rates.json
          git commit -m "chore(fx): refresh daily FX rates snapshot"
          git push

  weekly-link-health:
    name: Weekly Tier 3 Link Health Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '30 4 * * 1') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_link_health)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install root pipeline dependencies
        run: npm ci

      - name: Run Tier 3 outbound & citation link health check
        env:
          LINK_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.link_health_dry_run && 'true' || 'false' }}
          LINK_STRICT: ${{ github.event_name == 'workflow_dispatch' && inputs.link_health_strict && 'true' || 'false' }}
        run: |
          if [ "$LINK_DRY_RUN" = "true" ]; then
            node pipeline/check-links-health.mjs --dry-run
          elif [ "$LINK_STRICT" = "true" ]; then
            node pipeline/check-links-health.mjs --strict
          else
            npm run health:links
          fi

      - name: Publish Link Health Summary & Enforce <=5% Dead-Link SLA
        if: always()
        env:
          LINK_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.link_health_dry_run && 'true' || 'false' }}
        run: |
          if [ -f data/audit/link-health-report.json ]; then
            node --input-type=module -e '
              import fs from "node:fs";
              const r = JSON.parse(fs.readFileSync("data/audit/link-health-report.json", "utf8"));
              const s = r.summary;
              console.log("### Tier 3 Link Health Report");
              console.log(`- **Total unique URLs**: ${s.total_unique_urls}`);
              console.log(`- **OK**: ${s.ok} | **REDIRECT**: ${s.redirect} | **BOT_CHALLENGE**: ${s.bot_challenge} | **DEAD**: ${s.dead} (${s.dead_rate_pct}%)`);
              if (process.env.LINK_DRY_RUN !== "true" && Number(s.dead_rate_pct) > 5) {
                console.error(`FAIL: Dead link rate ${s.dead_rate_pct}% exceeds 5% threshold.`);
                process.exit(1);
              }
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Link Health Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specmatrix-link-health-report
          path: data/audit/link-health-report.json
          if-no-files-found: ignore
          retention-days: 30
